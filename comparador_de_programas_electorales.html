<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador de Propuestas Electorales - ArgElecciones</title>
  
  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse para procesar los CSV de Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <!-- FontAwesome para los íconos -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200 py-6 px-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Comparador de Programas Electorales</h1>
        <p class="text-sm font-medium text-slate-500 mt-1">ArgElecciones ToolBox — Presidenciales Argentina</p>
      </div>
      <div class="w-full md:w-72">
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" placeholder="Buscar propuesta..." class="w-full pl-9 pr-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium focus:ring-2 focus:ring-slate-900 focus:bg-white outline-none transition-all">
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Panel de Filtros -->
    <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-5">
      
      <!-- CANDIDATOS / FUERZAS POLÍTICAS -->
      <div>
        <h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-3">Candidatos / Fuerzas Políticas</h2>
        <div class="flex flex-wrap gap-2.5" id="candidateFilters">
          <!-- Chips de candidatos generados dinámicamente -->
        </div>
      </div>

      <!-- EJES TEMÁTICOS -->
      <div>
        <h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-3">Ejes Temáticos</h2>
        <div class="flex flex-wrap gap-2.5" id="topicButtons">
          <!-- Botones de ejes temáticos dinámicos -->
        </div>
      </div>

    </div>

    <!-- Estado de carga -->
    <div id="loading" class="text-center py-12">
      <i class="fas fa-circle-notch fa-spin text-3xl text-slate-800"></i>
      <p class="mt-3 text-sm font-medium text-slate-500">Cargando datos desde Google Sheets...</p>
    </div>

    <!-- Cuadrícula de Comparación -->
    <div id="comparisonGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Tarjetas por candidato -->
    </div>

  </main>

  <script>
    // Tu ID público de Google Sheet
    const SHEET_ID = '1r2iDJ25AAwpsp6rWnBvjzq_Yh4hYGb-_aoBrINlj6gQ';

    const CANDIDATES_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Candidatos`;
    const PROPOSALS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Propuestas`;

    // Mapa de íconos según tema o id del tema
const TOPIC_ICONS = {
  'economia': 'fa-chart-line',
  'trabajo': 'fa-briefcase',
  'empleo': 'fa-briefcase',
  'seguridad': 'fa-shield-halved',
  'educacion': 'fa-graduation-cap',
  'salud': 'fa-heart-pulse',
  'estado': 'fa-building-columns',
  'reforma': 'fa-building-columns',
  'vivienda_servicios': 'fa-house',
  'servicios': 'fa-bolt',
  'ambiente': 'fa-leaf',
  'genero': 'fa-venus-mars',
  'internacional': 'fa-globe',
  'agro': 'fa-wheat-awn'
};
    let candidates = [];
    let proposals = [];
    let selectedCandidates = new Set();
    let activeTopic = 'todos';
    let searchQuery = '';

    async function loadData() {
      try {
        const [candidatesRes, proposalsRes] = await Promise.all([
          fetch(CANDIDATES_URL).then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.text();
          }),
          fetch(PROPOSALS_URL).then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.text();
          })
        ]);

        candidates = Papa.parse(candidatesRes, { header: true, skipEmptyLines: true }).data;
        proposals = Papa.parse(proposalsRes, { header: true, skipEmptyLines: true }).data;

        // Por defecto todos los candidatos están seleccionados
        candidates.forEach(c => {
          if (c.id) selectedCandidates.add(c.id);
        });

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('comparisonGrid').classList.remove('hidden');

        renderCandidateFilters();
        renderTopicButtons();
        renderComparison();
      } catch (err) {
        console.error('Error al cargar datos:', err);
        document.getElementById('loading').innerHTML = `
          <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl max-w-xl mx-auto text-left text-xs font-medium">
            <p class="font-bold text-sm mb-1">Error al cargar los datos</p>
            <p>Verifica que la planilla de Google Sheets tenga permisos "Cualquier persona con el enlace puede ver" y que las pestañas se llamen Candidatos y Propuestas.</p>
          </div>
        `;
      }
    }

    function renderCandidateFilters() {
      const container = document.getElementById('candidateFilters');
      container.innerHTML = '';

      candidates.forEach(cand => {
        if (!cand.id) return;

        const isSelected = selectedCandidates.has(cand.id);
        const color = cand.color || '#3B82F6';

        const btn = document.createElement('button');
        btn.onclick = () => toggleCandidate(cand.id);
        btn.className = `flex items-center gap-2 px-3.5 py-1.5 rounded-full border text-xs font-medium transition-all ${
          isSelected 
            ? 'bg-white text-slate-800 shadow-sm border-slate-200 hover:bg-slate-50' 
            : 'bg-slate-100 text-slate-400 border-transparent hover:bg-slate-200'
        }`;

        btn.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${isSelected ? color : '#94A3B8'}"></span>
          <span>${cand.name} (${cand.party})</span>
        `;

        container.appendChild(btn);
      });
    }

    function toggleCandidate(candId) {
      if (selectedCandidates.has(candId)) {
        if (selectedCandidates.size > 1) { // Mantener al menos 1 candidato activo
          selectedCandidates.delete(candId);
        }
      } else {
        selectedCandidates.add(candId);
      }
      renderCandidateFilters();
      renderComparison();
    }

    function getTopicIcon(topicId, topicName) {
      const key = (topicId || topicName || '').toLowerCase();
      for (const [iconKey, iconClass] of Object.entries(TOPIC_ICONS)) {
        if (key.includes(iconKey)) return iconClass;
      }
      return 'fa-layer-group';
    }

    function renderTopicButtons() {
      const container = document.getElementById('topicButtons');
      const topicsMap = new Map();
      
      proposals.forEach(p => {
        if (p.topicId && p.topicName) {
          topicsMap.set(p.topicId, p.topicName);
        }
      });

      let html = `
        <button onclick="filterTopic('todos')" class="topic-btn flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold transition-all ${
          activeTopic === 'todos' 
            ? 'bg-slate-900 text-white shadow' 
            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
        }" data-topic="todos">
          <i class="fas fa-border-all text-xs"></i>
          <span>Todos los Ejes</span>
        </button>
      `;

      topicsMap.forEach((name, id) => {
        const iconClass = getTopicIcon(id, name);
        const isActive = activeTopic === id;

        html += `
          <button onclick="filterTopic('${id}')" class="topic-btn flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold transition-all ${
            isActive 
              ? 'bg-slate-900 text-white shadow' 
              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }" data-topic="${id}">
            <i class="fas ${iconClass} text-xs"></i>
            <span>${name}</span>
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function filterTopic(topicId) {
      activeTopic = topicId;
      renderTopicButtons();
      renderComparison();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderComparison();
    });

    function renderComparison() {
      const container = document.getElementById('comparisonGrid');
      container.innerHTML = '';

      const visibleCandidates = candidates.filter(c => selectedCandidates.has(c.id));

      visibleCandidates.forEach(cand => {
        const candidateProposals = proposals.filter(p => {
          const matchCand = p.candidateId === cand.id;
          const matchTopic = activeTopic === 'todos' || p.topicId === activeTopic;
          const matchSearch = !searchQuery || (
            (p.text && p.text.toLowerCase().includes(searchQuery)) ||
            (p.topicName && p.topicName.toLowerCase().includes(searchQuery))
          );
          return matchCand && matchTopic && matchSearch;
        });

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col";
        
        card.innerHTML = `
          <div class="p-4 border-b border-slate-100 flex items-center gap-3" style="border-top: 4px solid ${cand.color || '#3B82F6'}">
            <img src="${cand.avatar || 'https://via.placeholder.com/60'}" alt="${cand.name}" class="w-12 h-12 rounded-full object-cover border border-slate-200">
            <div>
              <h3 class="font-bold text-slate-900 text-sm tracking-tight">${cand.name}</h3>
              <p class="text-xs font-medium text-slate-500">${cand.party}</p>
            </div>
          </div>
          <div class="p-4 flex-1 space-y-3.5 overflow-y-auto max-h-[600px]">
            ${candidateProposals.length === 0 
              ? '<p class="text-xs text-slate-400 italic py-4 text-center">No hay propuestas registradas para este filtro.</p>' 
              : candidateProposals.map(p => {
                  const iconClass = getTopicIcon(p.topicId, p.topicName);
                  return `
                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100/80 space-y-2">
                      <div class="flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-600">
                        <i class="fas ${iconClass} text-slate-400 text-[10px]"></i>
                        <span>${p.topicName || p.topicId}</span>
                      </div>
                      <p class="text-xs text-slate-700 leading-relaxed font-normal">${p.text}</p>
                    </div>
                  `;
                }).join('')
            }
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Cargar datos
    loadData();
  </script>
</body>
</html>
